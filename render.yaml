services:
  - type: web
    name: tube-feed-inventory-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 90 "app:create_app()"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_TIMEZONE
        value: America/New_York
      # Neon connection string (postgresql://...?sslmode=require). Set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # ntfy topic the morning report is pushed to. Set in the Render dashboard
      # (the repo is public, so it doesn't belong here).
      - key: NTFY_TOPIC
        sync: false
      # Local hour (APP_TIMEZONE) the morning report goes out.
      - key: REPORT_HOUR
        value: "7"
