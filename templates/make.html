{% extends "base.html" %}
{% block title %}Log a batch · Meal Tracker{% endblock %}
{% block content %}
<div class="card">
  <h1>Log a batch</h1>
  {% if not recipes %}
    <p>Add a recipe first.</p>
    <a class="button" href="{{ url_for('new_recipe') }}">Add a recipe</a>
  {% else %}
  <form method="post">
    <label for="recipe_id">Recipe</label>
    <select id="recipe_id" name="recipe_id" required>
      <option value="">Choose…</option>
      {% for r in recipes %}
      <option value="{{ r.id }}" {{ 'selected' if selected_recipe == r.id|string }}>{{ r.name }}</option>
      {% endfor %}
    </select>
    <p class="small"><a href="{{ url_for('new_recipe') }}">+ New recipe</a></p>

    <label for="made_on">Made on</label>
    <input id="made_on" name="made_on" type="date" value="{{ form.get('made_on', today) }}" required>

    <fieldset>
      <legend>How many meals went where?</legend>
      {% for loc in locations %}
      <div class="split-row">
        <label for="qty_{{ loc.id }}">{{ loc.name }}</label>
        <input id="qty_{{ loc.id }}" name="qty_{{ loc.id }}" type="number" inputmode="numeric"
               min="0" step="1" value="{{ form.get('qty_' ~ loc.id, 0) }}">
      </div>
      {% endfor %}
    </fieldset>

    <label for="notes">Notes <span class="optional">(optional)</span></label>
    <textarea id="notes" name="notes" rows="2">{{ form.get('notes', '') }}</textarea>

    <button type="submit">Save batch</button>
  </form>
  {% endif %}
</div>
{% endblock %}
