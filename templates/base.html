<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d3557">
  <title>{% block title %}Thomas Tube Tracking{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="apple-mobile-web-app-title" content="Thomas Tube">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <button class="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span><span></span>
    </button>
    <a class="brand" href="{{ url_for('inventory') }}">
      <img src="{{ url_for('static', filename='logo-mark.svg') }}" alt="">
      Thomas Tube Tracking
    </a>
    <nav class="menu" id="site-menu" hidden>
      {% set ep = request.endpoint %}
      <a href="{{ url_for('fed_meal') }}" class="{{ 'active' if ep == 'fed_meal' }}">Fed a meal</a>
      <a href="{{ url_for('inventory') }}" class="{{ 'active' if ep == 'inventory' }}">Stock</a>
      <a href="{{ url_for('make_batch') }}" class="{{ 'active' if ep == 'make_batch' }}">Made a batch</a>
      <a href="{{ url_for('move') }}" class="{{ 'active' if ep == 'move' }}">Move / Use</a>
      <a href="{{ url_for('recipes') }}" class="{{ 'active' if ep in ('recipes', 'new_recipe', 'edit_recipe', 'recipe_detail') }}">Recipes</a>
      <a href="{{ url_for('history') }}" class="{{ 'active' if ep == 'history' }}">History</a>
    </nav>
  </header>
  <script>
    (function () {
      const button = document.querySelector(".menu-button");
      const menu = document.getElementById("site-menu");
      function setOpen(open) {
        menu.hidden = !open;
        button.setAttribute("aria-expanded", String(open));
      }
      button.addEventListener("click", (e) => { e.stopPropagation(); setOpen(menu.hidden); });
      document.addEventListener("click", (e) => { if (!menu.contains(e.target)) setOpen(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
    })();
  </script>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
