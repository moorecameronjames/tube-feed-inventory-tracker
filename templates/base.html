<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6f5e">
  <title>{% block title %}Meal Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('inventory') }}">Meal Tracker</a>
  </header>
  <nav class="tabs">
    {% set ep = request.endpoint %}
    <a href="{{ url_for('inventory') }}" class="{{ 'active' if ep == 'inventory' }}">Stock</a>
    <a href="{{ url_for('make_batch') }}" class="{{ 'active' if ep == 'make_batch' }}">Made</a>
    <a href="{{ url_for('move') }}" class="{{ 'active' if ep == 'move' }}">Move / Use</a>
    <a href="{{ url_for('recipes') }}" class="{{ 'active' if ep in ('recipes', 'new_recipe', 'edit_recipe', 'recipe_detail') }}">Recipes</a>
    <a href="{{ url_for('history') }}" class="{{ 'active' if ep == 'history' }}">History</a>
  </nav>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
